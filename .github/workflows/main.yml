name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачиваем файлы из репозитория
        uses: actions/checkout@v4

      - name: Распаковываем ваш ZIP-архив
        run: |
          unzip -q *.zip -d my_project_files
          
      - name: Устанавливаем Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Собираем APK файл
        run: |
          echo "--- ПОЛУЧЕННЫЕ ФАЙЛЫ ИЗ АРХИВА ---"
          find ./my_project_files
          echo "----------------------------------"
          
          # Ищем главный файл Android-проекта
          GRADLE_FILE=$(find ./my_project_files -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          
          if [ -z "$GRADLE_FILE" ]; then
            echo "❌ ОШИБКА: Файл build.gradle не найден! Проверьте, тот ли архив вы загрузили."
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "Найдена папка проекта: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # Если файла gradlew нет, генерируем его с помощью системного gradle
          if [ ! -f "gradlew" ]; then
            echo "Файл gradlew отсутствует. Генерируем автоматически..."
            gradle wrapper
          fi
          
          # Даем права на запуск и запускаем сборку
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Сохраняем готовый APK
        uses: actions/upload-artifact@v4
        with:
          name: READY_APP
          path: my_project_files/**/app/build/outputs/apk/debug/*.apk
