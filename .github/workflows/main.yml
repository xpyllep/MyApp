name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачиваем файлы из репозитория
        uses: actions/checkout@v4

      - name: Распаковываем ваш ZIP-архив
        run: |
          unzip -q *.zip -d my_project_files
          
      - name: Устанавливаем Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Собираем APK файл
        run: |
          # Ищем папку, где лежит загрузчик Gradle
          GRADLEW_DIR=$(dirname $(find ./my_project_files -name "gradlew" | head -n 1))
          cd "$GRADLEW_DIR"
          
          # Даем права на запуск и запускаем сборку
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Сохраняем готовый APK
        uses: actions/upload-artifact@v4
        with:
          name: READY_APP
          path: my_project_files/**/app/build/outputs/apk/debug/*.apk
