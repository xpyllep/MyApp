name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачиваем файлы из репозитория
        uses: actions/checkout@v4

      - name: Распаковываем ваш ZIP-архив
        run: |
          unzip -q *.zip -d my_project_files
          
      - name: Устанавливаем Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Собираем APK файл
        run: |
          # Ищем корень проекта по главному файлу настроек
          SETTINGS_FILE=$(find ./my_project_files -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
          
          if [ -z "$SETTINGS_FILE" ]; then
            echo "❌ ОШИБКА: Файл settings.gradle не найден! Проверьте структуру архива."
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Найдена корневая папка проекта: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # Генерируем gradlew в правильной корневой папке
          if [ ! -f "gradlew" ]; then
            echo "Файл gradlew отсутствует. Генерируем автоматически..."
            gradle wrapper
          fi
          
          # Даем права и запускаем сборку
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Сохраняем готовый APK
        uses: actions/upload-artifact@v4
        with:
          name: READY_APP
          path: my_project_files/**/app/build/outputs/apk/debug/*.apk
